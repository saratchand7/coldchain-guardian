{% extends 'base.html' %}{% block title %}Custody history{% endblock %}{% block content %}<section class="panel"><h3>Record handoff</h3><p>Custody changes append a historical event and cannot overwrite earlier handoffs.</p><form id="custodyForm" class="form-row"><select id="custodyShipment" required><option value="">Select shipment</option></select><input id="custodian" placeholder="New custodian" required><input id="custodyLocation" placeholder="Location" required><input id="custodyType" placeholder="Event type (handoff, receipt)" required><input id="custodyNotes" placeholder="Notes"><button class="button">Add custody event</button></form></section><section class="panel"><div class="panel-head"><div><h3>Custody event log</h3></div><select id="custodyFilter"><option value="">All shipments</option></select></div><div class="table-wrap"><table id="custodyTable"><thead><tr><th>Shipment</th><th>Previous custodian</th><th>New custodian</th><th>Event</th><th>Location</th><th>Timestamp</th><th>Notes</th></tr></thead><tbody></tbody></table></div></section>{% endblock %}
